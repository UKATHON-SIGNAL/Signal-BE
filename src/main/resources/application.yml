spring:
  application:
    name: signal-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/signal}
    username: ${DB_USERNAME:signal}
    password: ${DB_PASSWORD:signal}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080

signal-ai:
  base-url: ${SIGNAL_AI_BASE_URL:http://localhost:8001}
